  <text x="368" y="260" fill="#FAFAFA" font-family="-apple-system, sans-serif" font-size="14">Based on your indexed documents, system deployment requires three core modules:</text>
  
  <text x="368" y="298" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="14">1. <tspan font-weight="600" fill="#FFFFFF">FastAPI Backend:</tspan> Executes hybrid retrieval combining ChromaDB vector search and SQLite FTS5.</text>
  <text x="368" y="334" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="14">2. <tspan font-weight="600" fill="#FFFFFF">Offline LLM Layer:</tspan> Runs local qwen2.5:3b inference via Ollama without cloud calls.</text>
  <text x="368" y="370" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="14">3. <tspan font-weight="600" fill="#FFFFFF">React + Vite Interface:</tspan> Renders streaming chat with expandable source citations.</text>

  <text x="368" y="424" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="12">Citations:</text>
  
